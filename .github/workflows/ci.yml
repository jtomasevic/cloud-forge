name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:

  # ── Lint ──────────────────────────────────────────────────────────────────

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          args: --config=.golangci.yml

  # ── Unit Tests ────────────────────────────────────────────────────────────

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      # Required so the Codecov action can post status checks on PRs.
      statuses: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run unit tests
        run: |
          go test -short -race -count=1 \
            -coverprofile=coverage.out \
            -covermode=atomic \
            $(go list ./... | grep -v '/mocks' | grep -v 'internal/testutil')

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          # Fail the workflow step if Codecov upload errors so coverage
          # regressions are never silently ignored.
          fail_ci_if_error: true

      - name: Enforce 85% coverage threshold
        # Run after Codecov upload so the report is always uploaded even when
        # coverage is below the threshold (helps track the trend over time).
        run: |
          COVERAGE=$(go tool cover -func=coverage.out \
            | tail -1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN { exit !($COVERAGE < 85) }"; then
            echo "::error::Coverage ${COVERAGE}% is below the required 85% threshold."
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets the 85% threshold."

  # ── Integration Tests ─────────────────────────────────────────────────────

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run integration tests
        run: go test -tags=integration -race -count=1 -timeout=120s ./...

  # ── Build ─────────────────────────────────────────────────────────────────

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test-unit
    strategy:
      matrix:
        service:
          - cf
          - cf-install
          - cf-iam
          - cf-secrets
          - cf-resource
          - cf-events
          - cf-functions
          - cf-db
          - cf-gateway
          - cf-observe
          - cf-ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ${{ matrix.service }}
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o bin/${{ matrix.service }} \
            ./cmd/${{ matrix.service }}

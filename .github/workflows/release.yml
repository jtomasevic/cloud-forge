name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/jtomasevic/cloud-forge

jobs:

  # ── Build and push all service images ────────────────────────────────────

  images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    strategy:
      matrix:
        service:
          - cf
          - cf-install
          - cf-iam
          - cf-secrets
          - cf-resource
          - cf-events
          - cf-functions
          - cf-db
          - cf-gateway
          - cf-observe
          - cf-ai

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install ko
        uses: ko-build/setup-ko@v0.7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          DATE=$(date -u +%Y%m%d)

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Semver release: v0.1.0
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # Main branch: main-20260426-abc1234
            echo "tag=main-${DATE}-${SHA}" >> "$GITHUB_OUTPUT"
          fi

          echo "sha_tag=sha-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        env:
          KO_DOCKER_REPO: ${{ env.IMAGE_BASE }}/${{ matrix.service }}
        run: |
          ko build \
            --tags "${{ steps.tag.outputs.tag }},${{ steps.tag.outputs.sha_tag }}" \
            --bare \
            --platform linux/amd64,linux/arm64 \
            --image-label org.opencontainers.image.version=${{ steps.tag.outputs.tag }} \
            --image-label org.opencontainers.image.revision=${{ github.sha }} \
            --image-label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            --image-label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            ./cmd/${{ matrix.service }}

  # ── Create GitHub Release (on semver tags only) ───────────────────────────

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: images
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true

openapi: "3.0.3"

info:
  title: CloudForge Provisioner API
  description: |
    VPC provisioning API for the CloudForge control plane.

    This service is responsible for the full lifecycle of a tenant's isolated
    virtual private cluster: creation, status polling, and teardown.

    All provisioning operations are asynchronous. Every mutating endpoint
    returns 202 Accepted with a `job_id`. Clients must poll
    `GET /vpc/jobs/{job_id}` until the job reaches a terminal state
    (`READY` or `FAILED`).

    Authentication uses a long-lived API key (`cf_live_...`) in the
    `Authorization: Bearer` header. CF-Router validates the key and
    injects the resolved `X-CF-Tenant-ID` header before forwarding the
    request to this service.
  version: "0.1.0"
  contact:
    name: CloudForge Platform Team
    url: https://github.com/jtomasevic/cloud-forge

servers:
  - url: /api/v1/vpc
    description: CloudForge Provisioner API (VPC slice)

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        CloudForge API key (`cf_live_...`). CF-Router hashes the key and resolves
        the tenant before forwarding to this service.

  # -------------------------------------------------------------------------
  # Reusable schemas
  # -------------------------------------------------------------------------
  schemas:

    # ── ProvisionRequest ─────────────────────────────────────────────────────
    ProvisionRequest:
      type: object
      description: |
        Request body for provisioning a new tenant VPC environment.
        `tenant_id` must be a DNS label: lowercase alphanumeric characters
        and hyphens only, cannot start or end with a hyphen.
      required:
        - tenant_id
        - display_name
        - plan
      properties:
        tenant_id:
          type: string
          description: |
            Unique identifier for the tenant. Used as the Kubernetes namespace
            suffix and vCluster name. Must be a valid DNS label.
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9]([a-z0-9\\-]*[a-z0-9])?$"
          example: "acme-corp"
        display_name:
          type: string
          description: Human-readable name for the tenant (used in logs and UI).
          minLength: 1
          maxLength: 128
          example: "Acme Corporation"
        plan:
          type: string
          description: Billing plan tier that controls resource quotas.
          enum:
            - starter
            - pro
            - enterprise
          example: "starter"

    # ── JobAccepted ──────────────────────────────────────────────────────────
    JobAccepted:
      type: object
      description: Returned immediately (202) when a provisioning request is accepted.
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          format: uuid
          description: Opaque job identifier. Use with GET /vpc/jobs/{job_id} to poll status.
          example: "01920e4b-0000-7000-a000-000000000001"
        status:
          type: string
          description: Initial job status. Always QUEUED immediately after acceptance.
          enum:
            - QUEUED
          example: "QUEUED"

    # ── VPCInfo ───────────────────────────────────────────────────────────────
    VPCInfo:
      type: object
      description: Network topology details populated once the job reaches READY status.
      required:
        - pod_cidr
        - service_cidr
        - vcluster_ready
      properties:
        pod_cidr:
          type: string
          description: The /24 pod CIDR block allocated to this tenant's vCluster.
          example: "10.100.3.0/24"
        service_cidr:
          type: string
          description: The /24 service CIDR block allocated to this tenant's vCluster.
          example: "10.200.3.0/24"
        vcluster_ready:
          type: boolean
          description: Whether the vCluster API server passed its readiness check.
          example: true

    # ── JobStatus ────────────────────────────────────────────────────────────
    JobStatus:
      type: string
      description: Lifecycle state of a provisioning job.
      enum:
        - QUEUED
        - PROVISIONING
        - READY
        - FAILED
      example: "READY"

    # ── JobResponse ──────────────────────────────────────────────────────────
    JobResponse:
      type: object
      description: |
        Status and result of a provisioning or deprovisioning job.
        `api_key`, `api_key_id`, and `vpc_info` are only populated when
        `status` is `READY` for a provision operation.
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          format: uuid
          description: The job identifier.
          example: "01920e4b-0000-7000-a000-000000000001"
        status:
          $ref: "#/components/schemas/JobStatus"
        error_message:
          type: string
          description: |
            Human-readable failure reason. Only present when status is FAILED.
          example: "create vCluster: exit status 1"
        api_key:
          type: string
          description: |
            Raw API key for the provisioned tenant. Present ONLY on the first
            successful poll after READY status. Callers must store this value
            immediately — it is not retrievable after the first read.
          example: "cf_live_a1b2c3d4e5f6..."
        api_key_id:
          type: string
          format: uuid
          description: Stable identifier for the API key. Used to rotate or revoke the key.
          example: "01920e4b-0000-7000-a000-000000000002"
        vpc_info:
          $ref: "#/components/schemas/VPCInfo"

    # ── DeprovisionAccepted ──────────────────────────────────────────────────
    DeprovisionAccepted:
      type: object
      description: Returned immediately (202) when a deprovision request is accepted.
      required:
        - job_id
        - status
        - tenant_id
      properties:
        job_id:
          type: string
          format: uuid
          description: Job identifier for the deprovisioning operation.
          example: "01920e4b-0000-7000-a000-000000000003"
        status:
          type: string
          enum:
            - QUEUED
          example: "QUEUED"
        tenant_id:
          type: string
          description: The tenant slug being deprovisioned.
          example: "acme-corp"

    # ── ErrorDetail ───────────────────────────────────────────────────────────
    ErrorDetail:
      type: object
      description: Machine-readable error payload returned on all non-2xx responses.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Machine-readable ALL_CAPS_SNAKE_CASE error code. Consumers must
            branch on this field, never on the human-readable message.
          enum:
            - BAD_REQUEST
            - UNPROCESSABLE
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_ERROR
            - SERVICE_UNAVAILABLE
          example: "CONFLICT"
        message:
          type: string
          description: Human-readable explanation of what went wrong.
          example: "tenant \"acme-corp\" already exists"
        request_id:
          type: string
          description: Correlation ID from the X-Request-ID response header.
          example: "01HX5Z4N3V7QWMPXBCDE6GH892"

    # ── ErrorResponse ─────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

  # -------------------------------------------------------------------------
  # Reusable response definitions
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: The request body or path parameters failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: The request was well-formed but failed business-rule validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: A resource with the same identifier already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: An unexpected server-side error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: A required downstream resource (e.g. CIDR pool exhausted) is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  # -------------------------------------------------------------------------
  # Reusable path parameters
  # -------------------------------------------------------------------------
  parameters:
    TenantIDParam:
      name: tenant_id
      in: path
      required: true
      description: Tenant slug identifying the environment to operate on.
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: "^[a-z0-9]([a-z0-9\\-]*[a-z0-9])?$"
        example: "acme-corp"
    JobIDParam:
      name: job_id
      in: path
      required: true
      description: UUID of the provisioning or deprovisioning job.
      schema:
        type: string
        format: uuid
        example: "01920e4b-0000-7000-a000-000000000001"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # ── POST /vpc/provision ───────────────────────────────────────────────────
  /provision:
    post:
      operationId: provisionVPC
      summary: Provision a tenant VPC
      description: |
        Initiates the 10-step VPC provisioning workflow for a new tenant:
        CIDR allocation, namespace creation, Cilium policy application,
        vCluster creation, kubeconfig storage, API key generation.

        Returns 202 Accepted immediately. Poll `GET /vpc/jobs/{job_id}`
        for the final status and API key.
      tags:
        - VPC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionRequest"
      responses:
        "202":
          description: Provisioning job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── GET /vpc/jobs/{job_id} ────────────────────────────────────────────────
  /jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobIDParam"
    get:
      operationId: getJob
      summary: Get provisioning job status
      description: |
        Returns the current status of a provisioning or deprovisioning job.

        When `status` is `READY` for a provision job, the response includes
        the raw `api_key` (returned once only) and `vpc_info`.
      tags:
        - Jobs
      responses:
        "200":
          description: Job found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ── DELETE /vpc/{tenant_id} ───────────────────────────────────────────────
  /{tenant_id}:
    parameters:
      - $ref: "#/components/parameters/TenantIDParam"
    delete:
      operationId: deprovisionVPC
      summary: Deprovision a tenant VPC
      description: |
        Initiates the teardown workflow for an existing tenant environment:
        API key revocation, kubeconfig deletion, vCluster deletion,
        namespace removal, and CIDR release.

        Returns 202 Accepted immediately. Poll `GET /vpc/jobs/{job_id}`
        for completion.
      tags:
        - VPC
      responses:
        "202":
          description: Deprovisioning job accepted and queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeprovisionAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

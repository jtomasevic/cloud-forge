# Default service accounts and resource quotas for each CloudForge namespace.
# These are created alongside namespaces and provide baseline RBAC posture.
#
# Each namespace gets:
#   - A dedicated ServiceAccount (cf-<component>) with standard labels
#   - A ResourceQuota limiting runaway resource consumption in dev
#   - A LimitRange setting default container resource requests/limits

# ── cf-system ─────────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cf-system
  namespace: cf-system
  labels:
    app.kubernetes.io/part-of: cloudforge
    cloudforge.io/component: system
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cf-system-quota
  namespace: cf-system
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cf-system-limits
  namespace: cf-system
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi


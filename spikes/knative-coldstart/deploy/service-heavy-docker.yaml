apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fn-heavy
  namespace: default
  labels:
    app.kubernetes.io/part-of: cloudforge-spike
    cloudforge.io/spike: "0.8-coldstart"
    cloudforge.io/variant: heavy
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/initial-scale: "0"
        autoscaling.knative.dev/window: "6s"
        autoscaling.knative.dev/scale-to-zero-grace-period: "10s"
    spec:
      containers:
        - image: dev.local/fn-heavy:spike
          imagePullPolicy: Never
          ports:
            - name: http1
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30

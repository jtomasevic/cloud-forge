# =============================================================================
# NATS Server Configuration — CloudForge Spike 0.6
# =============================================================================
#
# PURPOSE
# -------
# This configuration enables hard multi-tenant isolation via NATS accounts.
# Each account creates a completely separate subject namespace: a connection
# authenticated into TENANT_A can never see subjects published within
# TENANT_B, even if both use identical subject strings.
#
# JetStream is enabled per-account so each tenant has its own stream
# storage that is not accessible to other accounts.
#
# DYNAMIC PROVISIONING
# --------------------
# New accounts can be added without restarting the cluster:
#   1. Append a new account block to this file.
#   2. Signal the running server:  kill -HUP <pid>
#        or inside Docker:         docker kill --signal=HUP nats-1
# The server reloads accounts in-place; existing connections are unaffected.
# See scripts/add-tenant.sh for an automated helper.
#
# CLUSTER
# -------
# Node-specific cluster settings (name, listen port, routes) are passed as
# CLI flags in config/nats-cluster.yaml rather than this file, so the same
# base config can be shared by all three nodes via a Docker bind mount.
# =============================================================================

# ---------------------------------------------------------------------------
# System account — used for NATS server monitoring and internal messaging.
# Must be declared before user accounts.
# ---------------------------------------------------------------------------
accounts {

  # SYS is the designated system account (see system_account below).
  # Only the server itself and infrastructure tooling connect with these
  # credentials.
  SYS {
    users = [
      { user: "sys", password: "sys-secret-change-in-prod" }
    ]
  }

  # -------------------------------------------------------------------------
  # TENANT_A — first spike tenant.
  # Credentials: user-a / password-a
  # -------------------------------------------------------------------------
  TENANT_A {
    users = [
      { user: "user-a", password: "password-a" }
    ]
    # Enable JetStream for this account.  Each JetStream-enabled account gets
    # its own isolated stream storage under the global store_dir.
    jetstream: enabled
  }

  # -------------------------------------------------------------------------
  # TENANT_B — second spike tenant used to verify cross-account isolation.
  # Credentials: user-b / password-b
  # -------------------------------------------------------------------------
  TENANT_B {
    users = [
      { user: "user-b", password: "password-b" }
    ]
    jetstream: enabled
  }

  # -------------------------------------------------------------------------
  # TENANT_C — added dynamically to demonstrate config-reload provisioning
  # (Q1).  The go program rewrites this file to include this block and then
  # signals the server to reload.
  # Credentials: user-c / password-c
  # -------------------------------------------------------------------------
  TENANT_C {
    users = [
      { user: "user-c", password: "password-c" }
    ]
    jetstream: enabled
  }

  # -------------------------------------------------------------------------
  # Accounts TENANT_01 … TENANT_50 for the Q5 sequential provisioning test.
  # Pre-provisioned here; the test measures how fast 50 separate connections
  # can be established after a single config reload.
  # -------------------------------------------------------------------------
  TENANT_01 { users = [{ user: "tenant-01", password: "pass-01" }], jetstream: enabled }
  TENANT_02 { users = [{ user: "tenant-02", password: "pass-02" }], jetstream: enabled }
  TENANT_03 { users = [{ user: "tenant-03", password: "pass-03" }], jetstream: enabled }

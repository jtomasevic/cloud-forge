# Designate the system account for server-level messaging.
system_account: SYS

# ---------------------------------------------------------------------------
# JetStream — persistent, replicated message streaming.
# store_dir must be writable by the nats-server process.
# In Docker, this is a named volume so data survives container restarts.
# ---------------------------------------------------------------------------
jetstream {
  store_dir: /data/jetstream

  # Caps prevent runaway tenant usage during the spike.
  max_memory_store: 512MB
  max_file_store:   2GB
}

# ---------------------------------------------------------------------------
# Logging — verbose enough to observe account-reload events in the spike.
# ---------------------------------------------------------------------------
debug:   false
trace:   false
logtime: true
